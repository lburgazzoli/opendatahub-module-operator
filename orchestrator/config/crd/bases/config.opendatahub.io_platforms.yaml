---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: platforms.config.opendatahub.io
spec:
  group: config.opendatahub.io
  names:
    kind: Platform
    listKind: PlatformList
    plural: platforms
    singular: platform
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Operational Mode
      jsonPath: .status.mode
      name: Mode
      type: string
    - description: Current Runlevel
      jsonPath: .status.currentRunlevel
      name: Runlevel
      type: integer
    - description: Platform Version
      jsonPath: .status.version
      name: Version
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Platform is the Schema for the platforms API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlatformSpec defines the desired state of Platform.
            properties:
              modules:
                description: |-
                  Modules lists the enabled module names (e.g. "ray", "spark").
                  Each entry must match a registered module in the orchestrator.
                items:
                  type: string
                type: array
            type: object
          status:
            description: PlatformStatus defines the observed state of Platform.
            properties:
              conditions:
                items:
                  description: Condition represents an observation of an object's
                    state.
                  properties:
                    lastHeartbeatTime:
                      description: |-
                        The last time we got an update on a given condition, this should not be set and is
                        present only for backward compatibility reasons.
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: message is a human-readable message indicating
                        details about the transition.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition.
                      type: string
                    severity:
                      description: |-
                        Severity with which to treat failures of this type of condition.
                        When this is not specified, it defaults to Error.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              currentRunlevel:
                description: CurrentRunlevel is the runlevel being processed during
                  upgrade mode.
                type: integer
              mode:
                allOf:
                - enum:
                  - ""
                  - upgrade
                  - reconcile
                - enum:
                  - upgrade
                  - reconcile
                description: Mode is the current operational mode.
                type: string
              modules:
                description: Modules is a per-module status summary.
                items:
                  description: ModuleStatusSummary holds a per-module status summary.
                  properties:
                    name:
                      type: string
                    runlevel:
                      type: integer
                    version:
                      type: string
                  required:
                  - name
                  - runlevel
                  type: object
                type: array
              observedGeneration:
                description: The generation observed by the resource controller.
                format: int64
                type: integer
              phase:
                type: string
              version:
                description: Version is the current platform version.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: Platform name must be default-platform
          rule: self.metadata.name == 'default-platform'
    served: true
    storage: true
    subresources:
      status: {}
