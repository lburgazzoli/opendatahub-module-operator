apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: {{ lower .Values.module.kind }}s.{{ .Values.module.group }}
spec:
  group: {{ .Values.module.group }}
  names:
    kind: {{ .Values.module.kind }}
    listKind: {{ .Values.module.kind }}List
    plural: {{ lower .Values.module.kind }}s
    singular: {{ lower .Values.module.kind }}
  scope: Cluster
  versions:
    - name: {{ .Values.module.version }}
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                release:
                  type: object
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      lastHeartbeatTime:
                        type: string
                        format: date-time
