apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  distribution.name: {{ .Values.distribution.name | default "unknown" | quote }}
  distribution.version: {{ .Values.distribution.version | default "unknown" | quote }}
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
