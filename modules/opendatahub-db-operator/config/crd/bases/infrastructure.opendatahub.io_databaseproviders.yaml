                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  storage:
                    description: Storage configures the instance's PersistentVolumeClaim.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Size is the requested PVC storage size.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: StorageClassName is passed through to the PVC
                          verbatim when set.
                        type: string
                    required:
                    - size
                    type: object
                    x-kubernetes-validations:
                    - message: storage.size must be greater than zero
                      rule: quantity(self.size).isGreaterThan(quantity('0'))
                  tls:
                    description: |-
                      TLS enables TLS for the internal PostgreSQL instance. Presence of this
                      field opts into TLS; an empty object uses controller defaults.
                    properties:
                      certificate:
                        description: Certificate customizes the server certificate
                          request.
                        properties:
                          duration:
                            description: Duration overrides the requested certificate
                              lifetime.
                            type: string
                          renewBefore:
                            description: RenewBefore overrides how long before expiry
                              cert-manager renews.
                            type: string
                          secretName:
                            description: SecretName overrides the cert-manager target
                              Secret name.
                            type: string
                        type: object
                      issuerRef:
                        description: IssuerRef overrides the default provider-scoped
                          self-signed issuer.
                        properties:
                          group:
                            description: Group defaults to cert-manager.io when omitted.
                            type: string
                          kind:
                            description: Kind defaults to Issuer when omitted.
                            type: string
                          name:
                            description: Name is the metadata.name of the referenced
                              issuer.
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                required:
                - storage
                type: object
              type:
