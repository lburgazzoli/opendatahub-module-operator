                      - pg_trgm
                      - uuid_ossp
                      - pgcrypto
                      type: string
                    type: array
                    x-kubernetes-validations:
                    - message: extensions are immutable once set
                      rule: self == oldSelf
                  namespace:
                    description: |-
                      Namespace overrides where the internal PostgreSQL resources are created.
