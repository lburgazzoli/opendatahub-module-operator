  name: databaseproviders.infrastructure.opendatahub.io
spec:
  group: infrastructure.opendatahub.io
  names:
    kind: DatabaseProvider
    listKind: DatabaseProviderList
    plural: databaseproviders
    singular: databaseprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Provider type
