                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              tls:
                description: TLS reports the resolved TLS state for the provider.
                properties:
                  certificateName:
                    description: CertificateName is the cert-manager Certificate name,
                      when managed.
                    type: string
                  enabled:
                    description: Enabled reflects whether TLS is configured for this
                      provider.
                    type: boolean
                  issuerRef:
                    description: IssuerRef identifies the issuer used for the current
                      certificate flow.
                    properties:
                      group:
                        description: Group defaults to cert-manager.io when omitted.
                        type: string
                      kind:
                        description: Kind defaults to Issuer when omitted.
                        type: string
                      name:
                        description: Name is the metadata.name of the referenced issuer.
                        type: string
                    required:
                    - name
                    type: object
                  namespace:
                    description: Namespace is where the TLS resources for this provider
                      live.
                    type: string
                  ready:
                    description: |-
                      Ready reports whether the provider's TLS contract is fully configured and
                      consumable.
                    type: boolean
                  secretName:
                    description: SecretName is the Secret name holding the server
                      certificate material.
                    type: string
                required:
                - enabled
                - ready
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
