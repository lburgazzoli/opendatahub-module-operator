                    type: integer
                type: object
              observedGeneration:
                description: The generation observed by the resource controller.
                format: int64
                type: integer
              phase:
                type: string
              releases:
                description: Releases is the list of deployed component releases.
                items:
                  description: ComponentRelease describes a single software component's
