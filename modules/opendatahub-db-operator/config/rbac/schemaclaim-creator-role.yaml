---
# Reference manifest only: bind this ClusterRole with a namespaced RoleBinding
# for tenant workloads that should create SchemaClaims. This operator does not
# apply or own the lifecycle of this role automatically.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: schemaclaim-creator
rules:
- apiGroups:
  - infrastructure.opendatahub.io
  resources:
  - schemaclaims
  verbs:
  - create
  - get
  - list
  - watch
