                        Deprecated: LastHeartbeatTime is present only for backward
                        compatibility with existing CRDs. New code should not set this field.
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from
                        one status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human-readable message indicating details about the
                        transition.
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the
                        condition was set based upon. If this does not match the resource's
                        current generation, the condition is likely stale.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for
                        the condition's last transition. The value should be a CamelCase
                        string.
                      type: string
                    severity:
                      description: |-
                        Severity indicates whether this condition represents an error or is
                        purely informational. Empty string (default) indicates error severity.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              connection:
                description: |-
                  Connection is the resolved connection surface once Provisioned,
                  including the effective credentials Secret name.
                properties:
                  database:
                    type: string
                  host:
                    type: string
                  port:
                    format: int32
                    type: integer
                  secretRef:
                    description: |-
                      SecretRef names the credentials Secret in the claim's own namespace.
                      When spec.secretName is set, it matches that value; otherwise it falls
                      back to the claim's own metadata.name.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              database:
                description: |-
                  Database echoes spec.database exactly -- always identical, no default
                  to resolve here (unlike SchemaClaim.status.schema).
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent .metadata.generation observed
                  by the controller. It allows consumers to determine whether the
                  controller has processed the latest spec changes.
                format: int64
                type: integer
              phase:
                description: Phase is the top-level lifecycle phase of the module.
                type: string
              provider:
                description: |-
                  Provider is the single DatabaseProvider ultimately selected when
                  spec.provider.selector matched more than one candidate (highest
                  selection-priority annotation, ties broken alphabetically by name --
