            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseClaimSpec defines the desired state of DatabaseClaim.
            properties:
              access:
                default: ReadWrite
                description: Access is the privilege level granted to the provisioned
                  user.
                enum:
                - ReadWrite
                - ReadOnly
                type: string
              database:
                description: |-
                  Database names a pre-existing database on the provider's backend.
                  Required, always -- unlike SchemaClaim.spec.schema, there is no
                  "${namespace}_${name}" fallback: the caller must always know and name
                  the exact pre-existing database. Immutable once set, for the same
                  reason SchemaClaim.spec.schema is: changing it mid-life implies a
                  different claim, not an update to this one.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: database is immutable once set
                  rule: self == oldSelf
              provider:
                description: Provider selects the DatabaseProvider to provision against.
                properties:
                  name:
                    description: Name is the exact DatabaseProvider name to bind to.
                    type: string
                  selector:
                    description: |-
                      Selector matches against DatabaseProvider capability labels. When
                      multiple providers match, the one with the highest
                      db.infrastructure.opendatahub.io/selection-priority annotation wins,
                      ties broken alphabetically by name (docs/plan.md §6).
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
