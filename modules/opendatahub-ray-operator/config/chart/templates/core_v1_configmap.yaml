apiVersion: v1
data:
  {{- with .Values.imagePullSecret }}
  imagePullSecret: {{ . }}
  {{- end }}
  platformType: {{ default "OpenDataHub" (index .Values.config "platformType") | quote }}
  platformVersion: {{ default "" (index .Values.config "platformVersion") | quote }}
  {{- range $key, $val := .Values.config }}
  {{- if and (ne $key "platformType") (ne $key "platformVersion") }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: opendatahub-ray-operator
  name: odh-ray-config
  namespace: {{ .Release.Namespace }}