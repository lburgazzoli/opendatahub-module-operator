name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  define-matrix:
    permissions:
      contents: read
    name: Define module matrix
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Emit module matrix
        id: modules
        run: |
          python3 - <<'PY'
          import json
          import os

          modules = []
          with open(".github/module-matrix.yaml", encoding="utf-8") as handle:
              for raw_line in handle:
                  line = raw_line.strip()
                  if line.startswith("- "):
                      modules.append({"module_name": line[2:].strip()})

          output = json.dumps({"module": modules}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"modules={output}\n")
          PY

  lint:
    needs: define-matrix
    permissions:
      contents: read
    name: lint ${{ matrix.module.module_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    env:
      MODULE_PATH: modules/${{ matrix.module.module_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ${{ env.MODULE_PATH }}/go.mod
          cache-dependency-path: ${{ env.MODULE_PATH }}/go.sum

      - name: Run module lint
        working-directory: ${{ env.MODULE_PATH }}
        run: make lint

  unit:
    needs: define-matrix
    permissions:
      contents: read
    name: unit ${{ matrix.module.module_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    env:
      MODULE_PATH: modules/${{ matrix.module.module_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ${{ env.MODULE_PATH }}/go.mod
          cache-dependency-path: ${{ env.MODULE_PATH }}/go.sum

      - name: Run module unit tests
        working-directory: ${{ env.MODULE_PATH }}
        run: make test

  module-tests:
    name: ${{ matrix.module.module_name }}
    needs:
      - define-matrix
      - lint
      - unit
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    uses: ./.github/workflows/module-test.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      module_name: ${{ matrix.module.module_name }}
      run_integration_tests: true
      run_e2e_tests: true
