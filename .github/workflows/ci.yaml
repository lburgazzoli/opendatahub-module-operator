name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  define-matrix:
    permissions:
      contents: read
    name: Define module matrix
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Emit module matrix
        id: modules
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          module_lines = subprocess.check_output(
              ["make", "list-modules"],
              text=True,
          ).splitlines()
          modules = []
          for module_line in module_lines:
              module = module_line.strip()
              if not module:
                  continue

              modules.append(
                  {
                      "module_name": module.removeprefix("modules/"),
                  }
              )

          output = json.dumps({"module": modules}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"modules={output}\n")
          PY

  module-lint:
    needs: define-matrix
    permissions:
      contents: read
    name: lint ${{ matrix.module.module_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    env:
      MODULE_PATH: modules/${{ matrix.module.module_name }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ${{ env.MODULE_PATH }}/go.mod
          cache-dependency-path: ${{ env.MODULE_PATH }}/go.sum

      - name: Run module lint
        working-directory: ${{ env.MODULE_PATH }}
        run: make lint

  module-unit:
    needs:
      - define-matrix
      - module-lint
    permissions:
      contents: read
    name: module-unit ${{ matrix.module.module_name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    uses: ./.github/workflows/module-test.yml
    secrets: inherit
    with:
      job_name: module-unit ${{ matrix.module.module_name }}
      module_name: ${{ matrix.module.module_name }}
      test_type: unit

  module-integration:
    # Temporarily disable integration lanes in CI.
    if: ${{ false }}
    name: module-integration ${{ matrix.module.module_name }}
    needs:
      - define-matrix
      - module-unit
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    uses: ./.github/workflows/module-test.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      job_name: module-integration ${{ matrix.module.module_name }}
      module_name: ${{ matrix.module.module_name }}
      test_type: integration

  module-e2e:
    # Temporarily disable e2e lanes in CI.
    if: ${{ false }}
    name: module-e2e ${{ matrix.module.module_name }}
    needs:
      - define-matrix
      - module-integration
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.define-matrix.outputs.modules) }}
    uses: ./.github/workflows/module-test.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      job_name: module-e2e ${{ matrix.module.module_name }}
      module_name: ${{ matrix.module.module_name }}
      test_type: e2e
