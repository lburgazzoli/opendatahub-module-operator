name: Example Module E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      img: ${{ steps.img.outputs.img }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: modules/opendatahub-mymodule-operator/go.mod

      - name: Compute image reference
        id: img
        run: |
          IMAGE_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          IMG="ttl.sh/${IMAGE_ID}:1h"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - name: Build and push image
        working-directory: modules/opendatahub-mymodule-operator
        run: |
          make container-build container-push IMG=${{ steps.img.outputs.img }}

  e2e-helm:
    permissions:
      contents: read
    name: e2e helm (OpenShift)
    needs: build
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ github.workspace }}/.tmp/mymodule-e2e-kubeconfig
      PICOSHIFT_CLUSTER_NAME: ocp-sim
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: modules/opendatahub-mymodule-operator/go.mod

      - name: Setup picoshift
        uses: ./.github/actions/setup-picoshift
        with:
          cluster_name: ${{ env.PICOSHIFT_CLUSTER_NAME }}
          kubeconfig_path: ${{ env.KUBECONFIG }}

      - name: Deploy via Helm
        working-directory: modules/opendatahub-mymodule-operator
        run: |
          make deploy-helm IMG=${{ needs.build.outputs.img }}

      - name: Run e2e tests
        working-directory: modules/opendatahub-mymodule-operator
        run: |
          make test-e2e-run

      - name: Collect picoshift diagnostics
        if: ${{ failure() }}
        run: |
          picoshift status || true
          picoshift logs || true
          kubectl get pods -A || true

      - name: Delete picoshift cluster
        if: ${{ always() }}
        run: |
          picoshift delete --name "${PICOSHIFT_CLUSTER_NAME}" || true
