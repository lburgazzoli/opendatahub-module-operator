name: Example Module E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      img: ${{ steps.img.outputs.img }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: modules/opendatahub-mymodule-operator/go.mod

      - name: Compute image reference
        id: img
        run: |
          IMG="ttl.sh/opendatahub-mymodule-operator-$(git rev-parse --short HEAD):1h"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - name: Build and push image
        working-directory: modules/opendatahub-mymodule-operator
        run: |
          make container-build container-push IMG=${{ steps.img.outputs.img }}

  e2e-helm:
    permissions:
      contents: read
    name: e2e helm (OpenShift)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: modules/opendatahub-mymodule-operator/go.mod

      - name: Write OpenShift kubeconfig
        env:
          OPENSHIFT_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "${OPENSHIFT_KUBECONFIG}" || {
            echo "Missing KUBECONFIG secret"
            exit 1
          }
          printf '%s\n' "${OPENSHIFT_KUBECONFIG}" > "${RUNNER_TEMP}/kubeconfig"
          chmod 600 "${RUNNER_TEMP}/kubeconfig"

      - name: Deploy via Helm
        working-directory: modules/opendatahub-mymodule-operator
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          make deploy-helm IMG=${{ needs.build.outputs.img }}

      - name: Run e2e tests
        working-directory: modules/opendatahub-mymodule-operator
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          make test-e2e-run
