name: Module Test Workflow

on:
  workflow_call:
    inputs:
      job_name:
        required: false
        type: string
        default: ""
      module_name:
        required: true
        type: string
      run_unit_tests:
        required: false
        type: boolean
        default: false
      run_integration_tests:
        required: false
        type: boolean
        default: false
      run_e2e_tests:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  test-module:
    permissions:
      contents: read
    name: ${{ inputs.job_name || inputs.module_name }}
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ github.workspace }}/.tmp/${{ inputs.module_name }}-kubeconfig
      MODULE_PATH: modules/${{ inputs.module_name }}
      ODH_PLATFORM_TYPE: OpenDataHub
      PICOSHIFT_CLUSTER_NAME: ocp-sim
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: ${{ env.MODULE_PATH }}/go.mod
          cache-dependency-path: ${{ env.MODULE_PATH }}/go.sum

      - name: Setup picoshift
        if: ${{ inputs.run_integration_tests || inputs.run_e2e_tests }}
        uses: ./.github/actions/setup-picoshift
        with:
          cluster_name: ${{ env.PICOSHIFT_CLUSTER_NAME }}
          kubeconfig_path: ${{ env.KUBECONFIG }}

      - name: Run unit tests
        if: ${{ inputs.run_unit_tests }}
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          make test

      - name: Run integration tests
        if: ${{ inputs.run_integration_tests }}
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          make test-integration

      - name: Compute image reference
        id: img
        if: ${{ inputs.run_e2e_tests }}
        run: |
          IMAGE_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          IMG="ttl.sh/${IMAGE_ID}:1h"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - name: Build and push image
        if: ${{ inputs.run_e2e_tests }}
        working-directory: ${{ env.MODULE_PATH }}
        env:
          CONTAINER_TOOL: podman --cgroup-manager cgroupfs
        run: |
          make container-build CONTAINER_TOOL="${CONTAINER_TOOL}" IMG=${{ steps.img.outputs.img }}
          make container-push CONTAINER_TOOL="${CONTAINER_TOOL}" IMG=${{ steps.img.outputs.img }}

      - name: Generate Helm chart
        if: ${{ inputs.run_e2e_tests }}
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          make helm

      - name: Run e2e tests
        if: ${{ inputs.run_e2e_tests }}
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          make test-e2e IMG=${{ steps.img.outputs.img }}

      - name: Dump namespace resources on failure
        if: ${{ failure() && (inputs.run_integration_tests || inputs.run_e2e_tests) }}
        run: |
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
            case "${ns}" in
              kube-system|kube-public|kube-node-lease|openshift*|default)
                continue
                ;;
            esac

            echo "===== namespace: ${ns} ====="
            kubectl get all,configmap,secret,serviceaccount,role,rolebinding,pvc -n "${ns}" || true
            echo "===== workloads (wide): ${ns} ====="
            kubectl get deployment,replicaset,pod -n "${ns}" -o wide || true
            for kind in deployment replicaset pod; do
              for name in $(kubectl get "${kind}" -n "${ns}" -o name 2>/dev/null); do
                echo "===== describe ${name} ====="
                kubectl describe -n "${ns}" "${name}" || true
              done
            done
            for pod in $(kubectl get pod -n "${ns}" -o name 2>/dev/null); do
              echo "===== logs ${pod} ====="
              kubectl logs -n "${ns}" "${pod}" --all-containers=true --tail=200 || true
              echo "===== previous logs ${pod} ====="
              kubectl logs -n "${ns}" "${pod}" --all-containers=true --previous --tail=200 || true
            done
            echo "===== events: ${ns} ====="
            kubectl get events -n "${ns}" --sort-by=.lastTimestamp || true
          done

      - name: Delete picoshift cluster
        if: ${{ always() && (inputs.run_integration_tests || inputs.run_e2e_tests) }}
        run: |
          env -u KUBECONFIG picoshift delete --name "${PICOSHIFT_CLUSTER_NAME}" || true
